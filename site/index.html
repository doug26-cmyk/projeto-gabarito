<!doctype html>
<html lang="pt-BR">
<head>

  <title>Gabarito — aprender jogando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

        <div class="whatsapp-item"><a class="whatsapp-cta" id="whatsapp-cta" href="#whatsapp-status" title="Entre em contato conosco" aria-label="WhatsApp: entre em contato conosco">

  <div id="app" aria-live="polite"></div>

      <p><strong>gabarito</strong> · Português e Matemática para avançar no seu ritmo.</p>

      <p>Compras neste site são demonstrativas. Nenhum pagamento é processado.</p>

  </footer>

  <div id="modal-root"></div>

  <script src="script.js?v=18plus" defer></script>
